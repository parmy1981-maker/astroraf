name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Log een keep-alive rij in Supabase
        run: |
          curl -sS -f \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"note":"automatische keep-alive"}' \
            "https://fqjlfonsdazjwgwchvko.supabase.co/rest/v1/keep_alive_log"

name: Supabase keep-alive

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Roep keep-alive endpoint aan
        run: |
          curl -sS -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://astroraf.be/api/cron/keepalive"

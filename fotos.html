<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroRaf.be — Foto's</title>
<link rel="stylesheet" href="styles.css">
<script src="i18n.js" defer></script>
<script src="gallery.js" defer></script>
<script src="cart.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="lang-switch">
      <button type="button" data-lang="nl">NL</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="de">DE</button>
    </div>
    <a href="index.html" class="logo">
      <img src="foto's/Logo_AstroRaf.png" alt="AstroRaf">
    </a>
    <nav class="main-nav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="fotos.html" class="active" data-i18n="nav_photos">Foto's</a>
      <a href="shop.html" data-i18n="nav_shop">Shop</a>
    </nav>
  </header>

  <div class="cart-widget" id="cartWidget">
    <button type="button" class="cart-toggle" id="cartToggle" aria-label="Winkelmandje" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span class="cart-count" id="cartCount" hidden>0</span>
    </button>
    <div class="cart-panel" id="cartPanel" hidden>
      <p class="cart-panel-title" data-i18n="cart_title">Winkelmandje</p>
      <div class="cart-items" id="cartItems"></div>
      <p class="cart-empty" id="cartEmpty" data-i18n="cart_empty">Je winkelmandje is leeg.</p>
      <button type="button" class="checkout-btn" hidden data-i18n="cart_checkout">Afrekenen</button>
    </div>
  </div>

  <div class="modal" id="checkoutModal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel">
      <button type="button" class="modal-close" data-modal-close aria-label="Close">&times;</button>
      <h2 class="section-title" data-i18n="checkout_title">Bestelling afronden</h2>

      <div class="checkout-summary" id="checkoutSummary"></div>

      <form id="checkoutForm" class="checkout-form">
        <label class="form-field">
          <span data-i18n="checkout_name">Naam</span>
          <input type="text" name="name" required>
        </label>
        <label class="form-field">
          <span data-i18n="checkout_email">E-mailadres</span>
          <input type="email" name="email" required>
        </label>
        <label class="form-field">
          <span data-i18n="checkout_address">Adres</span>
          <input type="text" name="address" required>
        </label>
        <label class="form-field">
          <span data-i18n="checkout_notes">Opmerkingen (optioneel)</span>
          <textarea name="notes" rows="3"></textarea>
        </label>
        <button type="submit" class="checkout-submit" data-i18n="checkout_submit">Bestelling versturen</button>
        <p class="checkout-form-note" data-i18n="checkout_form_note">Dit opent je e-mailprogramma met je bestelling al ingevuld, klaar om te versturen.</p>
      </form>
    </div>
  </div>

  <section class="gallery-page">
    <h1 class="hero-title hero-title-sm" data-i18n="albums_title">Albums</h1>

    <div class="album-grid" id="albumView">
      <button class="album-card" type="button" data-open-album="zonsverduistering">
        <span class="album-cover">
          <img src="foto's/Eclips_Corona.jpg" alt="Corona tijdens de totale zonsverduistering, astrofotografie door AstroRaf" data-i18n-alt="alt_gallery_corona">
        </span>
        <span class="album-name" data-i18n="album_zonsverduistering">Zonsverduistering</span>
      </button>
    </div>

    <div class="album-detail" data-album-detail="zonsverduistering" hidden>
      <button class="back-link" type="button" data-close-album>
        &larr; <span data-i18n="back_to_albums">Terug naar albums</span>
      </button>
      <h2 class="section-title" data-i18n="album_zonsverduistering">Zonsverduistering</h2>
      <div class="photo-grid">
        <div class="photo-tile">
          <button class="photo-placeholder photo-open" type="button" data-lightbox-src="foto's/Eclips_Start.jpg">
            <img src="foto's/Eclips_Start.jpg" alt="Start van de zonsverduistering, astrofotografie door AstroRaf" data-i18n-alt="alt_gallery_start">
          </button>
          <button class="like-btn" type="button" data-like="Eclips_Start.jpg" aria-label="Like" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.6-9.8-9.1C.6 8.1 2 4.8 5.2 4.1c2-.4 3.9.5 5 2.1a5.6 5.6 0 0 1 1.8-2c2.8-1.9 6.4-.6 7.6 2.4 1.6 3.9-1.1 8.5-7.6 13.9z"/></svg>
          </button>
        </div>
        <div class="photo-tile">
          <button class="photo-placeholder photo-open" type="button" data-lightbox-src="foto's/Eclips_Corona.jpg">
            <img src="foto's/Eclips_Corona.jpg" alt="Corona tijdens de totale zonsverduistering, astrofotografie door AstroRaf" data-i18n-alt="alt_gallery_corona">
          </button>
          <button class="like-btn" type="button" data-like="Eclips_Corona.jpg" aria-label="Like" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.6-9.8-9.1C.6 8.1 2 4.8 5.2 4.1c2-.4 3.9.5 5 2.1a5.6 5.6 0 0 1 1.8-2c2.8-1.9 6.4-.6 7.6 2.4 1.6 3.9-1.1 8.5-7.6 13.9z"/></svg>
          </button>
        </div>
        <div class="photo-tile">
          <button class="photo-placeholder photo-open" type="button" data-lightbox-src="foto's/Eclips_Einde.jpg">
            <img src="foto's/Eclips_Einde.jpg" alt="Einde van de zonsverduistering, astrofotografie door AstroRaf" data-i18n-alt="alt_gallery_einde">
          </button>
          <button class="like-btn" type="button" data-like="Eclips_Einde.jpg" aria-label="Like" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.6-9.8-9.1C.6 8.1 2 4.8 5.2 4.1c2-.4 3.9.5 5 2.1a5.6 5.6 0 0 1 1.8-2c2.8-1.9 6.4-.6 7.6 2.4 1.6 3.9-1.1 8.5-7.6 13.9z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" type="button" id="lightboxClose" aria-label="Close">&times;</button>
    <button class="lightbox-like" type="button" id="lightboxLike" aria-label="Like" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.6-9.8-9.1C.6 8.1 2 4.8 5.2 4.1c2-.4 3.9.5 5 2.1a5.6 5.6 0 0 1 1.8-2c2.8-1.9 6.4-.6 7.6 2.4 1.6 3.9-1.1 8.5-7.6 13.9z"/></svg>
    </button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <footer class="site-footer">
    <span class="footer-copy">&copy; 2026 AstroRaf.be &middot; v1.4.5</span>
    <div class="socials">
      <a href="mailto:info@astroraf.be" aria-label="E-mail" title="Stuur een e-mail naar info@astroraf.be">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>
      </a>
      <a href="#" aria-label="Instagram" title="Instagram (link later toevoegen)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
      <a href="#" aria-label="Facebook" title="Facebook (link later toevoegen)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H9v3h2v6h3v-6h3l1-3h-4V9c0-.6.4-1 1-1z"/></svg>
      </a>
      <a href="#" aria-label="YouTube" title="YouTube (link later toevoegen)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M11 10l4 2-4 2v-4z" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
  </footer>

</body>
</html>

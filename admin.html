<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AstroRaf.be — Beheer</title>
<link rel="stylesheet" href="styles.css">
<script src="vendor/supabase.js" defer></script>
<script src="admin.js" defer></script>
</head>
<body>

  <section class="gallery-page admin-page">
    <h1 class="section-title">Albumbeheer</h1>

    <div class="admin-panel">

      <div class="admin-state" id="stateLoading">
        <p>Bezig met laden…</p>
      </div>

      <div class="admin-state" id="stateLoggedOut" hidden>
        <p>Log in met het Google-account dat toegang heeft gekregen.</p>
        <button type="button" class="checkout-submit admin-google-btn" id="loginBtn">Inloggen met Google</button>
      </div>

      <div class="admin-state" id="stateNoAccess" hidden>
        <p>Dit Google-account (<span id="noAccessEmail"></span>) wordt niet herkend om toegang te verlenen.</p>

        <form id="accessRequestForm" class="checkout-form">
          <label class="form-field">
            <span>Bericht (optioneel)</span>
            <textarea id="accessRequestMessage" rows="3" placeholder="Bv. geef een reden op waarom je toegang wenst."></textarea>
          </label>
          <button type="submit" class="checkout-submit" id="requestAccessBtn">Toegang aanvragen</button>
        </form>

        <p class="checkout-form-note" id="accessRequestError" hidden></p>
        <button type="button" class="checkout-submit" id="logoutBtnNoAccess">Uitloggen</button>
      </div>

      <div class="admin-state" id="stateRequestSent" hidden>
        <p>Je aanvraag is verstuurd. Raf neemt deze door en neemt indien nodig contact met je op.</p>
        <button type="button" class="checkout-submit" id="logoutBtnRequestSent">Uitloggen</button>
      </div>

      <div class="admin-state" id="stateRedirecting" hidden>
        <p>Ingelogd — je wordt doorgestuurd naar de Foto's-pagina…</p>
      </div>

    </div>
  </section>

</body>
</html>
